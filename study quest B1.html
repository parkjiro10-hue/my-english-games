<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>📚 Study Quest</title>
    <style>
        :root {
            --bg: #faf8f5;
            --card: #ffffff;
            --gold: #c8963e;
            --gold-light: #f0d78c;
            --green: #6b9b6b;
            --blue: #7a9eb1;
            --red: #c97b7b;
            --text: #3a3530;
            --text-secondary: #8a8278;
            --border: #e5dfd5;
        }
        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            background: var(--bg);
            font-family: 'Georgia', 'Segoe UI', serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            min-height: 100dvh;
            overflow-y: auto;
            user-select: none;
            -webkit-user-select: none;
            -webkit-tap-highlight-color: transparent;
        }
        #app {
            width: 100%;
            max-width: 800px;
            min-height: 100vh;
            background: var(--bg);
            padding-bottom: 40px;
            position: relative;
        }

        /* Header */
        .header {
            background: linear-gradient(135deg, #faf8f5, #f5f0e8);
            padding: 25px 20px 20px;
            text-align: center;
            border-bottom: 1px solid var(--border);
            position: sticky;
            top: 0;
            z-index: 50;
        }
        .header h1 {
            color: var(--text);
            font-size: 28px;
            margin-bottom: 8px;
        }
        .b1-bar-container {
            max-width: 400px;
            margin: 0 auto;
        }
        .b1-bar-bg {
            width: 100%;
            height: 20px;
            background: #e8e2d8;
            border-radius: 10px;
            overflow: hidden;
            margin: 8px 0;
        }
        .b1-bar-fill {
            height: 100%;
            background: linear-gradient(90deg, #7a9eb1, #8db89a);
            border-radius: 10px;
            transition: width 0.5s;
        }
        .b1-percent {
            color: var(--text);
            font-size: 18px;
            font-weight: bold;
        }
        .b1-label {
            color: var(--text-secondary);
            font-size: 13px;
        }

        /* Tabs */
        .tabs {
            display: flex;
            background: var(--card);
            border-bottom: 1px solid var(--border);
            position: sticky;
            top: 130px;
            z-index: 40;
            overflow-x: auto;
        }
        .tab {
            flex: 1;
            padding: 14px 10px;
            text-align: center;
            color: var(--text-secondary);
            font-size: 14px;
            cursor: pointer;
            border: none;
            background: transparent;
            font-family: 'Georgia', serif;
            transition: all 0.2s;
            white-space: nowrap;
            border-bottom: 3px solid transparent;
        }
        .tab.active {
            color: var(--gold);
            border-bottom-color: var(--gold);
            font-weight: bold;
        }
        .tab:hover { background: #f5f0e8; }

        /* Content */
        .content {
            padding: 15px;
        }
        .category-title {
            color: var(--text);
            font-size: 20px;
            font-weight: bold;
            margin: 10px 5px 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .category-percent {
            color: var(--gold);
            font-size: 16px;
        }

        /* Book card */
        .book-card {
            background: var(--card);
            border-radius: 14px;
            border: 1px solid var(--border);
            margin-bottom: 10px;
            overflow: hidden;
            box-shadow: 0 2px 6px rgba(0,0,0,0.04);
            transition: all 0.2s;
        }
        .book-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 14px 16px;
            cursor: pointer;
            transition: background 0.2s;
            gap: 10px;
        }
        .book-header:hover { background: #f5f0e8; }
        .book-header-main {
            display: flex;
            align-items: center;
            gap: 10px;
            flex: 1;
            min-width: 0;
        }
        .book-arrow {
            color: var(--text-secondary);
            font-size: 14px;
            transition: transform 0.2s;
            flex-shrink: 0;
        }
        .book-arrow.open { transform: rotate(90deg); }
        .book-name {
            color: var(--text);
            font-size: 15px;
            font-weight: bold;
            flex: 1;
        }
        .book-stats {
            color: var(--text-secondary);
            font-size: 13px;
            flex-shrink: 0;
        }
        .book-percent {
            color: var(--gold);
            font-size: 14px;
            font-weight: bold;
            flex-shrink: 0;
            min-width: 45px;
            text-align: right;
        }

        /* Book body */
        .book-body {
            display: none;
            padding: 5px 10px 12px;
            border-top: 1px solid var(--border);
            background: #fdfcfa;
        }
        .book-body.open { display: block; }

        /* Section (for nested books) */
        .section-item {
            background: #faf8f5;
            border-radius: 10px;
            margin: 6px 0;
            overflow: hidden;
            border: 1px solid var(--border);
        }
        .section-header {
            display: flex;
            align-items: center;
            padding: 10px 12px;
            gap: 8px;
            cursor: pointer;
            transition: background 0.2s;
        }
        .section-header:hover { background: #f0ebe0; }
        .section-arrow {
            color: var(--text-secondary);
            font-size: 12px;
            transition: transform 0.2s;
            flex-shrink: 0;
            width: 14px;
        }
        .section-arrow.open { transform: rotate(90deg); }
        .section-checkbox {
            width: 22px;
            height: 22px;
            border: 2px solid var(--text-secondary);
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 13px;
            flex-shrink: 0;
            cursor: pointer;
            background: white;
            transition: all 0.2s;
        }
        .section-checkbox.checked {
            background: var(--green);
            border-color: var(--green);
            color: white;
        }
        .section-checkbox.partial {
            background: var(--gold-light);
            border-color: var(--gold);
            color: var(--text);
        }
        .section-name {
            color: var(--text);
            font-size: 14px;
            flex: 1;
            font-weight: bold;
        }
        .section-progress {
            color: var(--text-secondary);
            font-size: 12px;
            flex-shrink: 0;
        }

        /* Topic (flat list) */
        .topic-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 9px 12px;
            margin: 3px 0;
            background: #faf8f5;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
            border: 1px solid transparent;
        }
        .topic-item:hover { background: #f0ebe0; }
        .topic-checkbox {
            width: 22px;
            height: 22px;
            border: 2px solid var(--text-secondary);
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 13px;
            flex-shrink: 0;
            background: white;
            transition: all 0.2s;
        }
        .topic-checkbox.checked {
            background: var(--green);
            border-color: var(--green);
            color: white;
        }
        .topic-name {
            color: var(--text);
            font-size: 13.5px;
            flex: 1;
            line-height: 1.4;
        }
        .topic-item.completed .topic-name {
            color: var(--text-secondary);
            text-decoration: line-through;
        }

        /* Subtopics inside section */
        .subtopics-list {
            display: none;
            padding: 4px 8px 8px;
        }
        .subtopics-list.open { display: block; }
        .subtopic-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 7px 12px;
            margin: 2px 0;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .subtopic-item:hover { background: #f0ebe0; }
        .subtopic-checkbox {
            width: 20px;
            height: 20px;
            border: 2px solid var(--text-secondary);
            border-radius: 5px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            flex-shrink: 0;
            background: white;
            transition: all 0.2s;
        }
        .subtopic-checkbox.checked {
            background: var(--green);
            border-color: var(--green);
            color: white;
        }
        .subtopic-name {
            color: var(--text);
            font-size: 13px;
            flex: 1;
            line-height: 1.4;
        }
        .subtopic-item.completed .subtopic-name {
            color: var(--text-secondary);
            text-decoration: line-through;
        }

        .empty-state {
            text-align: center;
            color: var(--text-secondary);
            padding: 40px 20px;
            font-size: 15px;
        }

        /* Goal & Quests (from previous version) */
        .goal-section {
            margin: 15px;
            padding: 18px;
            background: var(--card);
            border-radius: 18px;
            border: 1px solid var(--border);
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
        }
        .section-title {
            color: var(--text);
            font-size: 18px;
            margin-bottom: 12px;
            font-weight: bold;
        }
        .goal-bar-bg {
            width: 100%;
            height: 18px;
            background: #f0ebe0;
            border-radius: 10px;
            overflow: hidden;
            margin: 10px 0;
        }
        .goal-bar-fill {
            height: 100%;
            background: linear-gradient(90deg, #c8963e, #e0b860);
            border-radius: 10px;
            transition: width 0.5s;
        }
        .goal-stats {
            display: flex;
            justify-content: space-between;
            color: var(--text-secondary);
            font-size: 14px;
        }
        .goal-edit-btn {
            display: inline-block;
            margin-top: 10px;
            color: var(--blue);
            font-size: 13px;
            cursor: pointer;
            text-decoration: underline;
        }
        .quest-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 14px;
            margin: 6px 0;
            background: #faf8f5;
            border-radius: 14px;
            cursor: pointer;
            transition: all 0.2s;
            color: var(--text);
            font-size: 15px;
            border: 1px solid var(--border);
        }
        .quest-item:hover { background: #f0ebe0; }
        .quest-item:active { transform: scale(0.98); }
        .quest-count {
            color: var(--text-secondary);
            font-size: 12px;
            margin-left: 8px;
        }
        .quest-gold {
            color: var(--gold);
            font-weight: bold;
            font-size: 15px;
        }
        .quests-total {
            text-align: center;
            color: var(--gold);
            font-size: 17px;
            margin-top: 12px;
            font-weight: bold;
        }
        .streak-badge {
            text-align: center;
            font-size: 40px;
            margin: 10px 0;
        }
        .streak-number {
            text-align: center;
            color: var(--gold);
            font-size: 26px;
            font-weight: bold;
        }
        .stat-row {
            display: flex;
            justify-content: space-between;
            padding: 10px 0;
            color: var(--text);
            font-size: 14px;
            border-bottom: 1px solid var(--border);
        }
        .stat-value {
            color: var(--gold);
            font-weight: bold;
        }

        /* Modals */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            background: rgba(0,0,0,0.5);
            z-index: 100;
            display: none;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .modal-overlay.show { display: flex; }
        .modal-box {
            background: var(--card);
            border-radius: 18px;
            padding: 25px;
            max-width: 400px;
            width: 100%;
        }
        .modal-header {
            color: var(--text);
            font-size: 20px;
            margin-bottom: 15px;
            text-align: center;
            font-weight: bold;
        }
        .modal-input {
            width: 100%;
            padding: 12px;
            border: 2px solid var(--border);
            border-radius: 12px;
            font-size: 16px;
            font-family: 'Georgia', serif;
            margin: 8px 0;
            outline: none;
            background: #faf8f5;
        }
        .modal-input:focus { border-color: var(--gold); }
        .modal-btn {
            width: 100%;
            padding: 14px;
            background: var(--gold);
            border: none;
            border-radius: 12px;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            font-family: 'Georgia', serif;
            margin-top: 8px;
        }
        .modal-btn:hover { background: #b8853a; }

        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(0,0,0,0.15); border-radius: 3px; }
    </style>
</head>

        <!-- CONTENT -->
        <div class="content" id="content"></div>
    </div>

    </div>

    <!-- ============================================ -->
    <script>
        // ===== STATE =====
        let totalGold = 0, todayGold = 0, streak = 0, bestStreak = 0, totalQuests = 0;
        let questCounts = {}, bookProgress = {}, lastDate = '';
        let goalName = 'Jewelry Findings', goalAmount = 2000;
        let currentTab = 'home';
        let openBooks = {}; // Какие учебники раскрыты
        let openSections = {}; // Какие секции раскрыты

        const quests = [
            { id: 'lesson', label: 'Complete a unit in a textbook', gold: 20 },
            { id: 'vocab10', label: 'Learn 10+ new words', gold: 15 },
            { id: 'review', label: 'Review words (any app)', gold: 10 },
            { id: 'listening', label: 'Listening 15+ min', gold: 10 },
            { id: 'reading', label: 'Reading in English', gold: 15 },
            { id: 'essay', label: 'Write an essay', gold: 30 },
            { id: 'wordfall', label: 'Play Word Splash', gold: 5 },
        ];

        const LEVELS = [
            { name: 'Apprentice', min: 0 }, { name: 'Scholar', min: 200 }, { name: 'Sage', min: 500 },
            { name: 'Archmage', min: 1000 }, { name: 'Legend', min: 2000 },
        ];

        // ===== STORAGE =====
        function save() {
            localStorage.setItem('studyquest_v2', JSON.stringify({
                totalGold, todayGold, streak, bestStreak, totalQuests, questCounts,
                bookProgress, lastDate, goalName, goalAmount
            }));
        }
        function load() {
            const raw = localStorage.getItem('studyquest_v2') || localStorage.getItem('studyquest');
            if (raw) {
                try {
                    const d = JSON.parse(raw);
                    totalGold = d.totalGold || 0; todayGold = d.todayGold || 0;
                    streak = d.streak || 0; bestStreak = d.bestStreak || 0;
                    totalQuests = d.totalQuests || 0; questCounts = d.questCounts || {};
                    bookProgress = d.bookProgress || {}; lastDate = d.lastDate || '';
                    goalName = d.goalName || 'Jewelry Findings'; goalAmount = d.goalAmount || 2000;
                } catch(e) {}
            }
        }
        load();

        // ===== DAY RESET =====
        const today = new Date().toDateString();
        if (lastDate !== today) {
            if (lastDate === new Date(new Date().setDate(new Date().getDate()-1)).toDateString()) streak++;
            else if (lastDate !== '') streak = 0;
            if (streak > bestStreak) bestStreak = streak;
            todayGold = 0; questCounts = {}; lastDate = today; save();
        }

        // ===== HELPERS =====
        function getLevel() {
            for (let i = LEVELS.length-1; i >= 0; i--) if (totalGold >= LEVELS[i].min) return LEVELS[i].name;
            return LEVELS[0].name;
        }

        // Подсчёт прогресса книги
        function countBookDone(book) {
            const prog = bookProgress[book.id] || {};
            if (book.sections) {
                // Книга с секциями
                let done = 0, total = 0;
                for (let si = 0; si < book.sections.length; si++) {
                    const sec = book.sections[si];
                    for (let ti = 0; ti < sec.topics.length; ti++) {
                        total++;
                        if (prog[si + '_' + ti]) done++;
                    }
                }
                return { done, total };
            } else {
                // Плоский список
                const total = book.topics.length;
                let done = 0;
                for (let i = 0; i < total; i++) if (prog[i]) done++;
                return { done, total };
            }
        }

        function getTotalProgress() {
            let done = 0, total = 0;
            for (const book of booksData) {
                const p = countBookDone(book);
                done += p.done;
                total += p.total;
            }
            return { done, total, percent: total > 0 ? Math.round((done/total)*100) : 0 };
        }

        function getCategoryProgress(cat) {
            let done = 0, total = 0;
            for (const book of booksData) {
                if (book.category !== cat) continue;
                const p = countBookDone(book);
                done += p.done;
                total += p.total;
            }
            return { done, total, percent: total > 0 ? Math.round((done/total)*100) : 0 };
        }

        // ===== РЕНДЕР =====
        function render() {
            // B1 бар
            const tp = getTotalProgress();
            document.getElementById('b1-bar').style.width = tp.percent + '%';
            document.getElementById('b1-percent').textContent = 
                tp.percent + '% (' + tp.done + '/' + tp.total + ')';

            // Табы
            document.querySelectorAll('.tab').forEach(t => {
                t.classList.toggle('active', t.dataset.tab === currentTab);
            });

            const content = document.getElementById('content');

            if (currentTab === 'home') {
                renderHome(content);
            } else if (currentTab === 'stats') {
                renderStats(content);
            } else {
                renderCategory(content, currentTab);
            }
        }

        function renderHome(content) {
            content.innerHTML = `
                <div class="goal-section">
                    <div class="section-title">🎯 Goal: <span id="goal-name">${goalName}</span></div>
                    <div class="goal-bar-bg"><div class="goal-bar-fill" id="goal-bar" style="width:0%"></div></div>
                    <div class="goal-stats">
                        <span id="goal-current">${totalGold}g</span>
                        <span id="goal-target">${goalAmount}g</span>
                    </div>
                    <div class="goal-edit-btn" onclick="openGoalEditor()">✏️ Edit goal</div>
                </div>
                <div class="goal-section">
                    <div class="section-title">⚔️ Daily Quests</div>
                    <div class="streak-badge" id="streak-emoji">🔥</div>
                    <div class="streak-number" id="streak-num">${streak} days</div>
                    <div id="quests-list"></div>
                    <div class="quests-total">Today: ${todayGold}g</div>
                </div>
            `;

            const pct = Math.min(100, Math.round((totalGold / goalAmount) * 100));
            document.getElementById('goal-bar').style.width = pct + '%';

            // Quests
            const ql = document.getElementById('quests-list');
            for (const q of quests) {
                const count = questCounts[q.id] || 0;
                const item = document.createElement('div');
                item.className = 'quest-item';
                item.innerHTML = `<span>🔄 ${q.label}${count > 0 ? `<span class="quest-count">×${count}</span>` : ''}</span><span class="quest-gold">+${q.gold}g</span>`;
                item.onclick = () => {
                    questCounts[q.id] = (questCounts[q.id] || 0) + 1;
                    todayGold += q.gold; totalGold += q.gold; totalQuests++; save(); render();
                };
                ql.appendChild(item);
            }

            document.getElementById('streak-emoji').textContent = streak >= 7 ? '🔥🔥🔥' : streak >= 3 ? '🔥🔥' : streak > 0 ? '🔥' : '💤';
        }

        function renderCategory(content, cat) {
            const catNames = { main: '📘 Основные', grammar: '📗 Грамматика', vocab: '📙 Лексика', extra: '📕 Дополнительные' };
            const cp = getCategoryProgress(cat);
            const books = booksData.filter(b => b.category === cat);

            content.innerHTML = `
                <div class="category-title">
                    <span>${catNames[cat]}</span>
                    <span class="category-percent">${cp.percent}% (${cp.done}/${cp.total})</span>
                </div>
                <div id="books-list"></div>
            `;

            const bl = document.getElementById('books-list');
            if (books.length === 0) {
                bl.innerHTML = '<div class="empty-state">Нет учебников в этой категории</div>';
                return;
            }

            for (const book of books) {
                bl.appendChild(renderBookCard(book));
            }
        }

        function renderBookCard(book) {
            const p = countBookDone(book);
            const pct = p.total > 0 ? Math.round((p.done / p.total) * 100) : 0;
            const isOpen = openBooks[book.id];

            const card = document.createElement('div');
            card.className = 'book-card';

            const header = document.createElement('div');
            header.className = 'book-header';
            header.innerHTML = `
                <div class="book-header-main">
                    <span class="book-arrow ${isOpen ? 'open' : ''}">▶</span>
                    <span class="book-name">${book.name}</span>
                </div>
                <span class="book-stats">${p.done}/${p.total}</span>
                <span class="book-percent">${pct}%</span>
            `;
            header.onclick = () => {
                openBooks[book.id] = !openBooks[book.id];
                render();
            };
            card.appendChild(header);

            const body = document.createElement('div');
            body.className = 'book-body' + (isOpen ? ' open' : '');

            if (book.sections) {
                // Книга с секциями
                for (let si = 0; si < book.sections.length; si++) {
                    body.appendChild(renderSection(book, si));
                }
            } else {
                // Плоский список
                for (let ti = 0; ti < book.topics.length; ti++) {
                    body.appendChild(renderTopic(book, ti));
                }
            }

            card.appendChild(body);
            return card;
        }

        function renderSection(book, si) {
            const sec = book.sections[si];
            const secId = book.id + '_s' + si;
            const isOpen = openSections[secId];

            let done = 0;
            for (let ti = 0; ti < sec.topics.length; ti++) {
                if (bookProgress[book.id] && bookProgress[book.id][si + '_' + ti]) done++;
            }
            const total = sec.topics.length;
            const allDone = done === total;
            const partial = done > 0 && done < total;

            const wrap = document.createElement('div');
            wrap.className = 'section-item';

            const header = document.createElement('div');
            header.className = 'section-header';
            header.innerHTML = `
                <span class="section-arrow ${isOpen ? 'open' : ''}">▶</span>
                <div class="section-checkbox ${allDone ? 'checked' : partial ? 'partial' : ''}" 
                     onclick="event.stopPropagation(); toggleSection('${book.id}', ${si});">
                    ${allDone ? '✓' : partial ? '−' : ''}
                </div>
                <span class="section-name">${sec.name}</span>
                <span class="section-progress">${done}/${total}</span>
            `;
            header.onclick = (e) => {
                if (e.target.classList.contains('section-checkbox')) return;
                openSections[secId] = !openSections[secId];
                render();
            };
            wrap.appendChild(header);

            const subList = document.createElement('div');
            subList.className = 'subtopics-list' + (isOpen ? ' open' : '');
            for (let ti = 0; ti < sec.topics.length; ti++) {
                const t = sec.topics[ti];
                const checked = bookProgress[book.id] && bookProgress[book.id][si + '_' + ti];
                const item = document.createElement('div');
                item.className = 'subtopic-item' + (checked ? ' completed' : '');
                item.innerHTML = `
                    <div class="subtopic-checkbox ${checked ? 'checked' : ''}">${checked ? '✓' : ''}</div>
                    <span class="subtopic-name">${t}</span>
                `;
                item.onclick = () => toggleSub('${book.id}', si, ti);
                subList.appendChild(item);
            }
            wrap.appendChild(subList);
            return wrap;
        }

        function renderTopic(book, ti) {
            const checked = bookProgress[book.id] && bookProgress[book.id][ti];
            const item = document.createElement('div');
            item.className = 'topic-item' + (checked ? ' completed' : '');
            item.innerHTML = `
                <div class="topic-checkbox ${checked ? 'checked' : ''}">${checked ? '✓' : ''}</div>
                <span class="topic-name">${book.topics[ti]}</span>
            `;
            item.onclick = () => toggleTopic(book.id, ti);
            return item;
        }

        function renderStats(content) {
            const tp = getTotalProgress();
            content.innerHTML = `
                <div class="goal-section">
                    <div class="section-title">📊 Overview</div>
                    <div class="stat-row"><span>Total Gold</span><span class="stat-value">${totalGold}g</span></div>
                    <div class="stat-row"><span>Best Streak</span><span class="stat-value">${bestStreak} days</span></div>
                    <div class="stat-row"><span>Current Streak</span><span class="stat-value">${streak} days</span></div>
                    <div class="stat-row"><span>Quests Completed</span><span class="stat-value">${totalQuests}</span></div>
                </div>
                <div class="goal-section">
                    <div class="section-title">📚 B1 Level</div>
                    <div class="stat-row"><span>Total Topics</span><span class="stat-value">${tp.total}</span></div>
                    <div class="stat-row"><span>Completed</span><span class="stat-value">${tp.done}</span></div>
                    <div class="stat-row"><span>Remaining</span><span class="stat-value">${tp.total - tp.done}</span></div>
                    <div class="stat-row"><span>Progress</span><span class="stat-value">${tp.percent}%</span></div>
                </div>
            `;
        }

        // ===== ACTIONS =====
        function toggleTopic(bookId, ti) {
            if (!bookProgress[bookId]) bookProgress[bookId] = {};
            bookProgress[bookId][ti] = !bookProgress[bookId][ti];
            save(); render();
        }

        function toggleSub(bookId, si, ti) {
            if (!bookProgress[bookId]) bookProgress[bookId] = {};
            const key = si + '_' + ti;
            bookProgress[bookId][key] = !bookProgress[bookId][key];
            save(); render();
        }

        function toggleSection(bookId, si) {
            const book = booksData.find(b => b.id === bookId);
            if (!book) return;
            const sec = book.sections[si];
            if (!bookProgress[bookId]) bookProgress[bookId] = {};
            // Проверяем, все ли отмечены
            let allDone = true;
            for (let ti = 0; ti < sec.topics.length; ti++) {
                if (!bookProgress[bookId][si + '_' + ti]) { allDone = false; break; }
            }
            // Если все отмечены — снимаем все, иначе — ставим все
            for (let ti = 0; ti < sec.topics.length; ti++) {
                bookProgress[bookId][si + '_' + ti] = !allDone;
            }
            save(); render();
        }

        function openGoalEditor() {
            document.getElementById('goal-name-input').value = goalName;
            document.getElementById('goal-amount-input').value = goalAmount;
            document.getElementById('goal-modal').classList.add('show');
        }
        function saveGoal() {
            const name = document.getElementById('goal-name-input').value.trim();
            const amount = parseInt(document.getElementById('goal-amount-input').value);
            if (name) goalName = name;
            if (amount > 0) goalAmount = amount;
            save(); render();
            document.getElementById('goal-modal').classList.remove('show');
        }

        // ===== TABS =====
        document.querySelectorAll('.tab').forEach(tab => {
            tab.onclick = () => {
                currentTab = tab.dataset.tab;
                render();
            };
        });

        // ===== START =====
        render();
    </script>
</body>
</html>
